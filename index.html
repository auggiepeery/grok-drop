<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030305">
<title>Grok Drop</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
  body{font-family:ui-sans-serif,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:#f2f4f8;background:#030305}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
  #app{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:stretch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .panel{background:rgba(10,11,16,.62);border:1px solid rgba(255,255,255,.12);border-radius:18px;
    box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;margin:6px 8px 0}
  .stat{display:flex;flex-direction:column;min-width:64px}
  .label{font-size:10px;letter-spacing:2.5px;font-weight:700;color:rgba(255,255,255,.5)}
  .val{font-size:25px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;transition:transform .12s,text-shadow .2s;transform-origin:left center}
  .val.bump{transform:scale(1.2);text-shadow:0 0 14px rgba(255,255,255,.8)}
  .best .val{font-size:17px;color:rgba(255,255,255,.72)}
  .title{font-weight:900;font-size:17px;letter-spacing:5px;text-align:center;flex:1;white-space:nowrap;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.45)}
  .title small{display:block;font-size:9px;letter-spacing:3px;font-weight:600;color:rgba(255,255,255,.45);text-shadow:none}
  .next{display:flex;flex-direction:column;align-items:center;gap:1px}
  #nextc{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .btns{display:flex;gap:6px}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s}
  .iconbtn:hover{background:rgba(255,255,255,.14)} .iconbtn:active{transform:scale(.92)}
  .iconbtn svg{width:19px;height:19px}
  #main{flex:1;display:flex;min-height:0}
  #stage{position:relative;flex:1;min-width:0;min-height:0}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #ladderWrap{margin:0 8px 6px;padding:4px 8px}
  #ladder{display:block;width:100%;height:40px}
  #side{display:none}
  #toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;font-weight:900;font-size:30px;letter-spacing:3px;color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,.9),0 0 30px rgba(140,180,255,.8);white-space:nowrap;opacity:0}
  #toast.show{animation:toast 1.8s ease-out forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .card{padding:26px 34px;text-align:center;min-width:260px;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-size:26px;font-weight:900;letter-spacing:4px;margin-bottom:12px;text-shadow:0 0 18px rgba(255,255,255,.5)}
  .card .row{font-size:14px;font-weight:600;color:rgba(255,255,255,.6);margin:4px 0}
  .card .big{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
  .card .newbest{color:#ffd23f;font-weight:900;letter-spacing:2px;margin:4px 0;min-height:20px;text-shadow:0 0 12px rgba(255,210,63,.6)}
  #overBot{display:block;margin:6px auto 0;width:90px;height:90px}
  .card button{margin:14px 5px 0;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:12px 30px;font:inherit;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;
    color:#000;background:#fff;box-shadow:0 0 20px rgba(255,255,255,.35);transition:transform .1s}
  .card button.ghost{background:transparent;color:#fff;box-shadow:none}
  .card button:active{transform:scale(.95)}
  .hint{font-size:12px;color:rgba(255,255,255,.45);margin-top:12px}
  #secretP{cursor:inherit;color:inherit;text-shadow:inherit;pointer-events:auto}
  @media (max-width:520px){.title{font-size:12px;letter-spacing:2px;flex:0 0 auto;text-align:left}.title small{display:none}#hud{padding-left:10px}.stat{min-width:54px}.val{font-size:22px}}
  .tag{display:none;font-size:9px;letter-spacing:1.5px;font-weight:800;color:#ffd23f}
  body.tainted .tag{display:block}
  #editorBar{display:none;margin:0 8px 6px;padding:8px;flex-direction:column;gap:8px}
  body.editing #editorBar{display:flex} body.editing #ladderWrap{display:none}
  #palette{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .pbtn{aspect-ratio:1;min-width:0;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pbtn canvas{width:100%;height:100%;display:block;pointer-events:none}
  .pbtn.sel,.tools button.sel{border-color:#fff;background:rgba(255,255,255,.18);box-shadow:0 0 12px rgba(255,255,255,.35)}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tools button{flex:1;min-width:64px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12px;font-weight:800;letter-spacing:.5px;padding:9px 8px;cursor:pointer;white-space:nowrap}
  .tools button:active{transform:scale(.96)}
  #edExit{background:#fff;color:#000}
  #codeInput{display:block;width:180px;margin:6px auto 0;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;
    font:inherit;font-size:22px;letter-spacing:8px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
  #codeInput:focus{border-color:#fff}
  .codemsg{min-height:20px;margin-top:8px;color:#ff6b81;font-weight:800;letter-spacing:1px}
  .card.nope{animation:nope .35s}
  @keyframes nope{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @media (max-width:340px){.val{font-size:20px}.stat{min-width:52px}.iconbtn{width:36px;height:36px}}
  /* wide screens: side panels so the jar can use the full height */
  @media (min-aspect-ratio:1/1) and (min-width:760px){
    #app{flex-direction:row}
    #hud{flex-direction:column;justify-content:flex-start;align-items:stretch;gap:16px;width:220px;margin:12px 0 12px 12px;padding:18px 18px}
    #hud .title{flex:0;text-align:left;font-size:22px;display:block}
    .stat{min-width:0}.val{font-size:34px}.best .val{font-size:22px}
    .next{align-items:flex-start}
    #nextc{width:84px;height:84px}
    .btns{margin-top:auto}
    .iconbtn{width:46px;height:46px}
    #main{flex:1}
    #ladderWrap{width:200px;margin:12px 12px 12px 0;padding:12px 6px;display:flex;flex-direction:column}
    #ladderWrap .label{padding:0 10px 6px}
    #ladder{height:100%;flex:1}
    #editorBar{width:200px;margin:12px 12px 12px 0;padding:12px}
    #palette{grid-template-columns:repeat(3,1fr);gap:6px}
    .tools{flex-direction:column}
  }
  #ladderWrap .label{display:none}
  @media (min-aspect-ratio:1/1) and (min-width:760px){#ladderWrap .label{display:block}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="hud" class="panel">
    <div class="title">GROK DRO<span id="secretP">P</span><small>MERGE THE BOTS</small></div>
    <div class="stat"><span class="label">SCORE</span><span class="val" id="score">0</span></div>
    <div class="stat best"><span class="label">BEST</span><span class="val" id="best">0</span><span class="tag">UNRANKED</span></div>
    <div class="next"><span class="label">NEXT</span><canvas id="nextc" width="168" height="168"></canvas></div>
    <div class="btns">
      <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button class="iconbtn" id="muteBtn" aria-label="Toggle sound"></button>
    </div>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="toast"></div>
    </div>
  </div>
  <div id="editorBar" class="panel">
    <span class="label">EDITOR</span>
    <div id="palette"></div>
    <div class="tools"><button id="edRemove">Remove</button><button id="edClear">Clear all</button><button id="edPhys">Physics: On</button><button id="edExit">Exit editor</button></div>
  </div>
  <div id="ladderWrap" class="panel"><span class="label">THE BOTS</span><canvas id="ladder"></canvas></div>
  <div id="over" class="overlay hidden">
    <div class="card panel">
      <h2>GAME OVER</h2>
      <div class="row">Score</div>
      <div class="big" id="finalScore">0</div>
      <div class="newbest" id="newBest"></div>
      <div class="row">Best: <span id="finalBest">0</span></div>
      <canvas id="overBot" width="180" height="180"></canvas>
      <div class="row" id="overTop">Biggest bot: Blip</div>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
  <div id="codeModal" class="overlay hidden">
    <div class="card panel">
      <h2>CODE</h2>
      <input id="codeInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Code">
      <div class="codemsg" id="codeMsg"></div>
      <button id="codeOk">OK</button><button id="codeCancel" class="ghost">CANCEL</button>
    </div>
  </div>
  <div id="paused" class="overlay hidden">
    <div class="card panel">
      <h2>PAUSED</h2>
      <div class="row">Score <span id="pauseScore">0</span></div>
      <button id="resumeBtn">RESUME</button><button id="pauseRestartBtn" class="ghost">RESTART</button>
      <div class="hint">Drag / move to aim · release or Space to drop · P to pause</div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
// ================================================================ constants
const WW = 420, WH = 700;                     // logical world size
const JL = 12, JR = 408, JT = 128, JB = 688;  // jar inner bounds (walls extend above JT)
const WALL_TOP = 18;                          // side walls continue up to here
const DANGER = 146;                           // game-over line
const DROP_Y = 66;                            // dropper y
const G = 1900, STEP = 1 / 120;
const MAX_V = 1300, MAX_UP = 700;
const BEST_KEY = 'grokDrop.best', MUTE_KEY = 'grokDrop.muted';
const TAU = Math.PI * 2;

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// Grok Bot avatar system: a simple coloured shape + two capsule eyes.
// Shapes are from the Grok Bot avatar editor's shape list; tier 4 is Harry's real
// avatar (magenta teardrop); the final tier is the black "pebble" Grok Bot mark style.
const TIERS = [
  { name: 'Blip',   shape: 'circle',   r: 14,  c: '#4cc9f0' },
  { name: 'Pilly',  shape: 'pill',     r: 19,  c: '#a3e635' },
  { name: 'Trix',   shape: 'triangle', r: 25,  c: '#ff8c42' },
  { name: 'Cubo',   shape: 'square',   r: 32,  c: '#3d7bff' },
  { name: 'Harry',  shape: 'teardrop', r: 40,  c: '#ff3ec9' },
  { name: 'Hexa',   shape: 'hexagon',  r: 49,  c: '#8b5cf6' },
  { name: 'Nimbus', shape: 'cloud',    r: 59,  c: '#e6edf7' },
  { name: 'Lovey',  shape: 'heart',    r: 70,  c: '#ff4d6d' },
  { name: 'Bloom',  shape: 'flower',   r: 82,  c: '#2ee6b8' },
  { name: 'Nova',   shape: 'star',     r: 95,  c: '#ffcf33' },
  { name: 'Grok',   shape: 'pebble',   r: 110, c: '#0b0b0d', grok: true },
];
const TOP = TIERS.length - 1;
const POINTS = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
const SPAWN_W = [30, 26, 20, 14, 10];

// ---------------------------------------------------------------- shape geometry (unit radius)
function smoothRadial(fn, n = 180, k = 6) {
  const r = []; for (let i = 0; i < n; i++) r.push(fn(i / n * TAU));
  const s = r.map((_, i) => { let a = 0; for (let j = -k; j <= k; j++) a += r[(i + j + n) % n]; return a / (2 * k + 1); });
  return s.map((v, i) => [Math.cos(i / n * TAU) * v, Math.sin(i / n * TAU) * v]);
}
function polyR(n, apo, rot) { return th => { const seg = TAU / n; let p = ((th - rot) % seg + seg) % seg - seg / 2; return Math.min(apo / Math.cos(p), 1.6); }; }
function normPts(pts, maxR) {
  let m = 0; for (const [x, y] of pts) m = Math.max(m, Math.hypot(x, y));
  return pts.map(([x, y]) => [x / m * maxR, y / m * maxR]);
}
function centerPts(pts) {
  let cx = 0, cy = 0; for (const [x, y] of pts) { cx += x; cy += y; } cx /= pts.length; cy /= pts.length;
  return pts.map(([x, y]) => [x - cx, y - cy]);
}
function shapePoints(shape) {
  switch (shape) {
    case 'circle': return smoothRadial(() => 1, 96, 0);
    case 'pill': { const pts = [], hw = 1, hh = 0.72, rr = hh;
      for (let i = 0; i < 120; i++) { const t = i / 120 * TAU; const cx = Math.cos(t) >= 0 ? hw - rr : -(hw - rr); pts.push([cx + Math.cos(t) * rr, Math.sin(t) * rr]); } return pts; }
    case 'triangle': return normPts(centerPts(smoothRadial(th => 0.7 * polyR(3, 0.56, -Math.PI / 2)(th) + 0.3, 180, 9)), 1.12);
    case 'square': return normPts(smoothRadial(th => 0.88 * polyR(4, 0.8, Math.PI / 4)(th) + 0.12 * 0.95, 180, 7), 1.1);
    case 'hexagon': return normPts(smoothRadial(polyR(6, 0.9, 0), 180, 4), 1.06);
    case 'teardrop': { const pts = []; for (let i = 0; i < 160; i++) { const t = i / 160 * TAU; const s = Math.sin(t / 2);
        pts.push([0.98 * Math.sin(t) * Math.pow(s, 0.9), -Math.cos(t)]); }
      return normPts(centerPts(pts), 1.1); }
    case 'cloud': return normPts(smoothRadial(th => { let r = 0.82 + 0.2 * Math.pow(Math.abs(Math.cos(2.5 * (th + Math.PI / 2))), 0.7);
        const sn = Math.sin(th); if (sn > 0.25) r = Math.min(r, 0.8 / sn); return r * (1 + 0.12 * Math.abs(Math.cos(th))); }, 200, 2), 1.08);
    case 'heart': { const pts = []; for (let i = 0; i < 160; i++) { const t = i / 160 * TAU;
        pts.push([16 * Math.pow(Math.sin(t), 3) / 16, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]); }
      return normPts(centerPts(pts), 1.1); }
    case 'flower': return normPts(smoothRadial(th => 0.74 + 0.3 * Math.pow(Math.abs(Math.cos(2.5 * (th + Math.PI / 2))), 0.8), 200, 2), 1.08);
    case 'star': return normPts(smoothRadial(th => { const seg = TAU / 5; let p = ((th + Math.PI / 2) % seg + seg) % seg / seg; p = Math.abs(p - 0.5) * 2; return 0.56 + 0.56 * Math.pow(p, 1.25); }, 200, 4), 1.14);
    case 'pebble': return normPts(smoothRadial(th => 1 + 0.05 * Math.sin(2 * th + 0.9) + 0.035 * Math.cos(3 * th) - 0.03 * Math.sin(th), 160, 3).map(([x, y]) => [x * 1.05, y * 0.95]), 1.04);
  }
}
// ---------------------------------------------------------------- collision geometry
// Each bot collides with its real outline: the drawn outline is simplified (Douglas-Peucker,
// max deviation COLL_TOL world units at full size) and, if concave, split into convex parts
// (ear clipping + Hertel-Mehlhorn merge). Walls/floor test the outline vertices.
const COLL_TOL = 0.3;
function areaProps(p) { // p: [[x,y]...], returns signed area, centroid, second moment about origin
  let A = 0, cx = 0, cy = 0, J = 0;
  for (let i = 0, n = p.length; i < n; i++) {
    const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % n], cr = x1 * y2 - x2 * y1;
    A += cr; cx += (x1 + x2) * cr; cy += (y1 + y2) * cr; J += cr * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
  }
  A /= 2; return { A, cx: cx / (6 * A), cy: cy / (6 * A), J: J / 12 };
}
function segDistP(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1e-12;
  let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t);
}
function simplifyClosed(pts, tol) {
  const n = pts.length; let far = 0, fd = 0;
  for (let i = 1; i < n; i++) { const d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]); if (d > fd) { fd = d; far = i; } }
  const keep = new Uint8Array(n); keep[0] = keep[far] = 1;
  const rec = (i, j) => {
    let md = 0, mi = -1; const a = pts[i % n], b = pts[j % n];
    for (let k = i + 1; k < j; k++) { const d = segDistP(pts[k % n], a, b); if (d > md) { md = d; mi = k; } }
    if (md > tol) { keep[mi % n] = 1; rec(i, mi); rec(mi, j); }
  };
  rec(0, far); rec(far, n);
  return pts.filter((_, i) => keep[i]);
}
function crossO(a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); }
function convexIdx(P, poly) {
  const n = poly.length;
  for (let i = 0; i < n; i++) if (crossO(P[poly[i]], P[poly[(i + 1) % n]], P[poly[(i + 2) % n]]) < -1e-9) return false;
  return true;
}
function ptInTri(p, a, b, c) { return crossO(a, b, p) > 1e-12 && crossO(b, c, p) > 1e-12 && crossO(c, a, p) > 1e-12; }
function earClip(P) {
  const idx = P.map((_, i) => i), tris = []; let guard = 0;
  while (idx.length > 3 && guard++ < 10000) {
    let found = false;
    for (let k = 0; k < idx.length; k++) {
      const m = idx.length, i0 = idx[(k - 1 + m) % m], i1 = idx[k], i2 = idx[(k + 1) % m];
      if (crossO(P[i0], P[i1], P[i2]) <= 1e-10) continue;
      let inside = false;
      for (const j of idx) { if (j === i0 || j === i1 || j === i2) continue; if (ptInTri(P[j], P[i0], P[i1], P[i2])) { inside = true; break; } }
      if (inside) continue;
      tris.push([i0, i1, i2]); idx.splice(k, 1); found = true; break;
    }
    if (!found) { // only degenerate (collinear) vertices left: drop the flattest one
      let bi = 0, bv = Infinity; const m = idx.length;
      for (let k = 0; k < m; k++) { const v = Math.abs(crossO(P[idx[(k - 1 + m) % m]], P[idx[k]], P[idx[(k + 1) % m]])); if (v < bv) { bv = v; bi = k; } }
      idx.splice(bi, 1);
    }
  }
  if (idx.length === 3) tris.push(idx.slice());
  return tris;
}
function hertelMehlhorn(P, tris) {
  const parts = tris.map(t => t.slice()); let merged = true;
  while (merged) {
    merged = false;
    outer: for (let a = 0; a < parts.length; a++) for (let b = a + 1; b < parts.length; b++) {
      const A = parts[a], B = parts[b];
      for (let i = 0; i < A.length; i++) {
        const u = A[i], v = A[(i + 1) % A.length], j = B.indexOf(v);
        if (j < 0 || B[(j + 1) % B.length] !== u) continue;
        const Ar = [], Br = [];
        for (let k = 0; k < A.length; k++) Ar.push(A[(i + 1 + k) % A.length]);

  for (const b of bots) {
    b.blink -= dt; if (b.blink < 0) { b.blinkT = 0.12; b.blink = 2 + Math.random() * 5; }
    if (b.blinkT > 0) b.blinkT -= dt; if (b.happy > 0) b.happy -= dt;
  }
  for (const p of particles) {
    p.life += dt;
    if (p.type !== 'ring' && p.type !== 'shock') { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.vx *= Math.exp(-2.5 * dt); p.vy *= Math.exp(-1.2 * dt); }
  }
  particles = particles.filter(p => p.life < p.max);
  for (const f of floats) f.life += dt; floats = floats.filter(f => f.life < f.max);
}
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  const frozen = state === 'paused' || modalOpen;
  if (!frozen) {
    if (!(state === 'editor' && physPaused)) {
      acc += dt; let n = 0;
      while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
      if (n >= 6) acc = 0;
    } else { acc = 0; for (const b of bots) updateWorld(b); }
    update(dt);
  }
  drawBg(frozen ? 0 : dt);
  render(frozen ? 0 : dt);
  requestAnimationFrame(frame);
}

// ================================================================ boot
bestEl.textContent = best;
buildPalette();
setMuted(muted);
resize();
restart();
requestAnimationFrame(t => { last = t; frame(t); });

// test/debug hook
window.GrokDrop = {
  get state() { return state; }, get score() { return score; }, get best() { return best; }, get bots() { return bots; }, get topReached() { return topReached; },
  drop(x) { if (x != null) aimX = x; return drop(); },
  spawn(t, x, y, a = 0) { const b = makeBot(t, x, y, a); b.landed = true; bots.push(b); return b; },
  get physPaused() { return physPaused; }, get tainted() { return tainted; },
  // drawn (visual) outline of a bot in world coords, for overlap measurement
  drawnOutline(b) { const T = TIERS[b.t], c = Math.cos(b.a), s = Math.sin(b.a); return T.pts.map(([x, y]) => [b.x + (x * c - y * s) * b.r, b.y + (x * s + y * c) * b.r]); },
  contactPairs() { const out = new Set(); for (let k = 0; k < ccount; k++) { const C = cpool[k]; if (C.b && C.lam > 0) out.add(Math.min(C.a.id, C.b.id) + '-' + Math.max(C.a.id, C.b.id)); } return [...out]; },
  landingY, step: dt => step(dt || STEP), collisionInfo: () => TIERS.map(T => ({ name: T.name, verts: T.N, parts: T.parts.length })),
  get current() { return curTier; }, set current(t) { curTier = t; drawNext(); },
  restart, pause: setPaused, TIERS, world: { WW, WH, JL, JR, JT, JB, DANGER, DROP_Y },
};
})();
