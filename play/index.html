<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030305">
<title>Grok Drop</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
  body{font-family:ui-sans-serif,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:#f2f4f8;background:#030305}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
  #app{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:stretch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .panel{background:rgba(10,11,16,.62);border:1px solid rgba(255,255,255,.12);border-radius:18px;
    box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;margin:6px 8px 0}
  .stat{display:flex;flex-direction:column;min-width:64px}
  .scoreStat{position:relative}
  #comboMeter{position:absolute;left:100%;top:50%;width:38px;height:38px;margin:-19px 0 0 2px;display:none;pointer-events:none;z-index:2}
  #comboMeter.on{display:block}#comboMeter.bump{animation:cbump .25s ease-out}
  #comboMeter svg{position:absolute;inset:0;transform:rotate(-90deg)}
  #comboMeter .trk{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.15);stroke-width:3}
  #comboMeter .arc{fill:none;stroke:#ffd23f;stroke-width:3;stroke-linecap:round;stroke-dasharray:94.25;filter:drop-shadow(0 0 3px #ffd23f)}
  #comboMeter b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#ffd23f}
  @keyframes cbump{0%{transform:scale(1.45)}100%{transform:scale(1)}}
  .label{font-size:10px;letter-spacing:2.5px;font-weight:700;color:rgba(255,255,255,.5)}
  .val{font-size:25px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;transition:transform .12s,text-shadow .2s;transform-origin:left center}
  .val.bump{transform:scale(1.2);text-shadow:0 0 14px rgba(255,255,255,.8)}
  .best .val{font-size:17px;color:rgba(255,255,255,.72)}
  .title{font-weight:900;font-size:17px;letter-spacing:5px;text-align:center;flex:1;white-space:nowrap;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.45)}
  .title small{display:block;font-size:9px;letter-spacing:3px;font-weight:600;color:rgba(255,255,255,.45);text-shadow:none}
  .next{display:flex;flex-direction:column;align-items:center;gap:1px}
  #nextc{width:46px;height:46px;border-radius:50%;outline:2px dashed rgba(255,255,255,.28);outline-offset:2px;opacity:.85;filter:saturate(.75);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .btns{display:flex;gap:6px}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s}
  .iconbtn:hover{background:rgba(255,255,255,.14)} .iconbtn:active{transform:scale(.92)}
  .iconbtn svg{width:19px;height:19px}
  #main{flex:1;display:flex;min-height:0}
  #stage{position:relative;flex:1;min-width:0;min-height:0}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #ladderWrap{margin:0 8px 6px;padding:4px 8px}
  #ladder{display:block;width:100%;height:40px}
  #side{display:none}
  #toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;font-weight:900;font-size:clamp(18px,6.4vw,30px);letter-spacing:3px;width:max-content;max-width:92%;text-align:center;white-space:normal;color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,.9),0 0 30px rgba(140,180,255,.8);opacity:0}
  #toast.show{animation:toast 1.8s ease-out forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .card{padding:26px 34px;text-align:center;min-width:260px;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-size:26px;font-weight:900;letter-spacing:4px;margin-bottom:12px;text-shadow:0 0 18px rgba(255,255,255,.5)}
  .card .row{font-size:14px;font-weight:600;color:rgba(255,255,255,.6);margin:4px 0}
  .card .big{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
  .card .newbest{color:#ffd23f;font-weight:900;letter-spacing:2px;margin:4px 0;min-height:20px;text-shadow:0 0 12px rgba(255,210,63,.6)}
  #overBot{display:block;margin:6px auto 0;width:90px;height:90px}
  #overRow{display:block;margin:4px auto 8px;width:280px;height:32px}
  .card .overNext{color:#ffd23f;font-weight:800}
  .card button.share{background:#2ee6b8;color:#05221b}
  .card button{margin:14px 5px 0;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:12px 30px;font:inherit;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;
    color:#000;background:#fff;box-shadow:0 0 20px rgba(255,255,255,.35);transition:transform .1s}
  .card button.ghost{background:transparent;color:#fff;box-shadow:none}
  .card button:active{transform:scale(.95)}
  .hint{font-size:12px;color:rgba(255,255,255,.45);margin-top:12px}
  #collection{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:#fff;font-family:inherit;touch-action:pan-y;
    background:radial-gradient(ellipse at 50% -15%,rgba(140,110,255,.28),transparent 55%),radial-gradient(ellipse at 50% 125%,rgba(255,170,80,.14),transparent 60%),rgba(4,4,11,.95)}
  #collection.hidden{display:none}
  body.colopen #paused{visibility:hidden}
  #collection{animation:colIn .32s cubic-bezier(.2,.9,.3,1.15)}
  #collection.closing{animation:colOut .22s ease-in forwards}
  @keyframes colIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
  @keyframes colOut{to{opacity:0;transform:scale(.96)}}
  .colCard{animation:cardIn .45s cubic-bezier(.2,.9,.3,1.3) backwards}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.9)}}
  #colBtn{position:relative}
  #colBtn.new::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#ffd23f;box-shadow:0 0 10px #ffd23f;animation:newdot 1.1s ease-in-out infinite}
  @keyframes newdot{50%{transform:scale(1.5);opacity:.6}}
  .colHead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;gap:10px}
  .colTitle{font-weight:900;letter-spacing:5px;font-size:18px;text-shadow:0 0 18px rgba(255,255,255,.45)}
  .colSub{font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.55);margin-top:4px}
  #colGrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;padding:10px 18px 26px;align-content:start}
  .colCard{position:relative;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.1);padding:6px 12px 12px;text-align:center;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;user-select:none;-webkit-user-select:none}
  .colCard.sel{transform:scale(1.04);border-color:rgba(255,255,255,.45);box-shadow:0 0 30px rgba(160,140,255,.25)}
  .colCard canvas{width:100%;aspect-ratio:1/1;display:block;pointer-events:none}
  .colCard .nm{font-weight:900;letter-spacing:2px;font-size:15px}
  .colCard .meta{font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin:2px 0 6px}
  .colCard .desc{font-size:12px;line-height:1.35;color:rgba(255,255,255,.78);min-height:48px}
  .colCard .cnt{font-size:11px;margin-top:8px;color:#ffd23f;font-weight:700;letter-spacing:.4px;line-height:1.5}
  .colCard.locked .nm,.colCard.locked .desc{color:rgba(255,255,255,.32)}
  .colCard.locked .cnt{color:rgba(255,255,255,.3)}
  @media (max-width:520px){#colGrid{grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 10px 22px}.colCard{padding:4px 8px 10px}.colCard .desc{font-size:11px;min-height:58px}.colTitle{font-size:15px;letter-spacing:3px}}
  #padBtn{display:none}
  body.mode-zen #padBtn{display:flex}
  .toggles{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
  .card .tog{display:flex;align-items:center;gap:6px;margin:0;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800;background:rgba(46,230,184,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(46,230,184,.6);min-width:0}
  .card .tog .ic{width:18px;height:18px;display:inline-flex}.card .tog svg{width:18px;height:18px}
  .card .tog.off{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:rgba(255,255,255,.55)}
  .card .tog::after{content:'ON';font-size:10px;opacity:.8}.card .tog.off::after{content:'OFF'}
  body.colopen #paused,body.menuopen #paused,body.menuopen #over{visibility:hidden}
  .modecard{width:min(440px,92vw)}
  #modeList{display:flex;flex-direction:column;gap:10px;margin:12px 0 6px}
  #modeList .modeOpt{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:8px 14px 8px 8px;text-align:left;border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);color:#fff;box-shadow:none;font:inherit;min-height:0;letter-spacing:0;font-size:14px;
    animation:cardIn .42s cubic-bezier(.2,.9,.3,1.3) backwards;transition:transform .18s,border-color .2s,box-shadow .2s}
  #modeList .modeOpt:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35)}
  #modeList .modeOpt.cur{border-color:rgba(255,210,63,.75);box-shadow:0 0 22px rgba(255,210,63,.18)}
  .modeOpt canvas{width:78px;height:78px;flex:0 0 78px}
  .modeOpt b{display:block;font-size:16px;letter-spacing:2px;font-weight:900}
  .modeOpt span{display:block;font-size:12px;color:rgba(255,255,255,.7);margin:3px 0 4px;font-weight:500;letter-spacing:0;line-height:1.3}
  .modeOpt em{font-style:normal;font-size:11px;color:#ffd23f;font-weight:700;letter-spacing:1px}
  .modeName{color:#ffd23f;letter-spacing:3px;font-size:11px;font-weight:800}
  #stage{transition:transform .12s linear}
  body.mode-zen #score{opacity:.55;font-size:.8em}
  @media (max-width:520px){.modeOpt canvas{width:60px;height:60px;flex-basis:60px}.modeOpt b{font-size:14px}}
  #secretP{cursor:inherit;color:inherit;text-shadow:inherit;pointer-events:auto}
  @media (max-width:520px){.title{font-size:12px;letter-spacing:2px;flex:0 0 auto;text-align:left}.title small{display:none}#hud{padding-left:10px;flex-wrap:wrap;row-gap:4px}.stat{min-width:54px}.val{font-size:22px}.btns{flex:1 1 100%;order:5;justify-content:space-evenly}.btns .iconbtn{width:36px;height:36px}}
  .tag{display:none;font-size:9px;letter-spacing:1.5px;font-weight:800;color:#ffd23f}
  body.tainted .tag{display:block}
  #editorBar{display:none;margin:0 8px 6px;padding:8px;flex-direction:column;gap:8px}
  body.editing #editorBar{display:flex} body.editing #ladderWrap{display:none}
  #palette{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .pbtn{aspect-ratio:1;min-width:0;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pbtn canvas{width:100%;height:100%;display:block;pointer-events:none}
  .pbtn.sel,.tools button.sel{border-color:#fff;background:rgba(255,255,255,.18);box-shadow:0 0 12px rgba(255,255,255,.35)}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tools button{flex:1;min-width:64px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12px;font-weight:800;letter-spacing:.5px;padding:9px 8px;cursor:pointer;white-space:nowrap}
  .tools button:active{transform:scale(.96)}
  #edExit{background:#fff;color:#000}
  #codeInput{display:block;width:180px;margin:6px auto 0;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;
    font:inherit;font-size:22px;letter-spacing:8px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
  #codeInput:focus{border-color:#fff}
  .codemsg{min-height:20px;margin-top:8px;color:#ff6b81;font-weight:800;letter-spacing:1px}
  .card.nope{animation:nope .35s}
  @keyframes nope{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @media (max-width:340px){.val{font-size:20px}.stat{min-width:52px}.iconbtn{width:36px;height:36px}}
  /* wide screens: side panels so the jar can use the full height */
  @media (min-aspect-ratio:1/1) and (min-width:760px){
    #app{flex-direction:row}
    #hud{flex-direction:column;justify-content:flex-start;align-items:stretch;gap:16px;width:220px;margin:12px 0 12px 12px;padding:18px 18px}
    #hud .title{flex:0;text-align:left;font-size:22px;display:block}
    .stat{min-width:0}.val{font-size:34px}.best .val{font-size:22px}
    .next{align-items:flex-start}
    #nextc{width:84px;height:84px}
    .btns{margin-top:auto}
    .iconbtn{width:46px;height:46px}
    #main{flex:1}
    #ladderWrap{width:200px;margin:12px 12px 12px 0;padding:12px 6px;display:flex;flex-direction:column}
    #ladderWrap .label{padding:0 10px 6px}
    #ladder{height:100%;flex:1}
    #editorBar{width:200px;margin:12px 12px 12px 0;padding:12px}
    #palette{grid-template-columns:repeat(3,1fr);gap:6px}
    .tools{flex-direction:column}
  }
  #ladderWrap .label{display:none}
  @media (min-aspect-ratio:1/1) and (min-width:760px){#ladderWrap .label{display:block}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="collection" class="hidden" role="dialog" aria-label="Bot collection">
  <div class="colHead"><div><div class="colTitle">BOT COLLECTION</div><div class="colSub" id="colSub"></div></div><button id="colClose" class="iconbtn" aria-label="Close collection">&#10005;</button></div>
  <div id="colGrid"></div>
</div>
<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;display:block"></canvas>
<div id="app">
  <div id="hud" class="panel">
    <div class="title">GROK DRO<span id="secretP">P</span><small>MERGE THE BOTS</small></div>
    <div class="stat scoreStat"><span class="label">SCORE</span><span class="val" id="score">0</span><div id="comboMeter" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="trk"/><circle cx="18" cy="18" r="15" class="arc" id="comboArc"/></svg><b id="comboTxt">x2</b></div></div>
    <div class="stat best"><span class="label">BEST</span><span class="val" id="best">0</span><span class="tag">UNRANKED</span></div>
    <div class="next"><span class="label">NEXT &rsaquo;</span><canvas id="nextc" width="168" height="168"></canvas></div>
    <div class="btns">
      <button class="iconbtn" id="modeBtn" aria-label="Game modes" title="Game modes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg></button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button class="iconbtn" id="colBtn" aria-label="Bot collection" title="Bot collection (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg></button>
    </div>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="toast"></div>
    </div>
  </div>
  <div id="editorBar" class="panel">
    <span class="label">EDITOR</span>
    <div id="palette"></div>
    <div class="tools"><button id="edRemove">Remove</button><button id="edClear">Clear all</button><button id="edPhys">Physics: On</button><button id="edExit">Exit editor</button></div>
  </div>
  <div id="ladderWrap" class="panel"><span class="label">THE BOTS</span><canvas id="ladder"></canvas></div>
  <div id="over" class="overlay hidden">
    <div class="card panel">
      <h2>GAME OVER</h2>
      <div class="row modeName" id="overMode"></div>
      <div class="row">Score</div>
      <div class="big" id="finalScore">0</div>
      <div class="newbest" id="newBest"></div>
      <div class="row">Best: <span id="finalBest">0</span></div>
      <canvas id="overBot" width="180" height="180"></canvas>
      <div class="row" id="overTop">Biggest bot: Blip</div>
      <div class="row overNext" id="overNext"></div>
      <div class="row" id="overMerges">Merges: 0</div>
      <canvas id="overRow" width="560" height="64"></canvas>
      <button id="shareBtn" class="share">SHARE</button>
      <button id="restartBtn">PLAY AGAIN</button><button id="overModes" class="ghost">MODES</button>
    </div>
  </div>
  <div id="codeModal" class="overlay hidden">
    <div class="card panel">
      <h2>CODE</h2>
      <input id="codeInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Code">
      <div class="codemsg" id="codeMsg"></div>
      <button id="codeOk">OK</button><button id="codeCancel" class="ghost">CANCEL</button>
    </div>
  </div>
  <div id="modeMenu" class="overlay hidden" role="dialog" aria-label="Choose mode">
    <div class="card panel modecard">
      <h2>CHOOSE MODE</h2>
      <div id="modeList"></div>
      <button id="modeBack" class="ghost">BACK</button>
    </div>
  </div>
  <div id="paused" class="overlay hidden">
    <div class="card panel">
      <h2>PAUSED</h2>
      <div class="row">Score <span id="pauseScore">0</span></div>
      <button id="resumeBtn">RESUME</button><button id="pauseRestartBtn" class="ghost">RESTART</button><button id="pauseModes" class="ghost">MODES</button>
      <div class="toggles">
        <button class="tog" id="muteBtn" aria-label="Toggle sound"><span class="ic"></span><span class="lb">Sound</span></button>
        <button class="tog" id="vibeBtn" aria-label="Toggle vibration" title="Vibration (V)"><span class="ic"></span><span class="lb">Haptics</span></button>
        <button class="tog" id="padBtn" aria-label="Ambient music" title="Ambient music (N)"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span><span class="lb">Zen pad</span></button>
      </div>
      <div class="hint">Drag / move to aim · release or Space to drop · P to pause</div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
// ================================================================ constants
const WW = 420, WH = 700;                     // logical world size
const JL = 12, JR = 408, JB = 688;           // jar inner bounds (walls extend above JT)
let JT = 128, WALL_TOP = 18, DANGER = 146, DROP_Y = 66;   // top of jar / side-wall tops / game-over line / dropper y
// tall portrait screens: the jar top (and dropper + danger line) sits LAY_COMPACT lower and the view crops the band above,
// so the jar is shorter and fills the screen (less dead drop distance). Applied only at restart, never mid-game.
const LAY_COMPACT = 50; let layOff = 0, wantOff = 0;
const G = 1900, STEP = 1 / 120;
const MAX_V = 1300, MAX_UP = 700;
